# Every working day: scan the library lists against OSV (and Snyk, when the
# SNYK_TOKEN secret is set) and keep one open
# issue, "Package update request", with the consolidated list of versions to
# request. It is edited in place, gets a comment only when a package is new,
# and is closed when nothing is left to request. The run fails while any
# library has a known vulnerability.
name: Scan

on:
  schedule:
    - cron: "0 18 * * 0-4"   # 18:00 UTC Sun-Thu = 02:00 UTC+8 Mon-Fri
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-issue
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      # Snyk runs only when the secret exists. The token itself is mapped
      # into the one step that needs it.
      HAS_SNYK: ${{ secrets.SNYK_TOKEN != '' }}
    permissions:
      actions: read   # to download the previous run's report
      contents: read  # to check out the catalogue
      issues: write   # to open, update and close the issue
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: '[[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The report is diffed against the latest completed run that uploaded
      # one. Runs fail while vulnerabilities exist, so "success" alone would
      # mark every finding new each day. The first run, or expired artifacts,
      # simply have no previous report.
      - name: Download the previous report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ids=$(gh run list --workflow scan.yml --branch "$DEFAULT_BRANCH" --status completed --limit 20 --json databaseId --jq '.[].databaseId')
          for id in $ids; do
            artifact=$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "report" and .expired == false)] | .[0].id // empty')
            if [[ -n "$artifact" ]]; then
              gh run download "$id" -n report -D prev
              test -f prev/report.json
              break
            fi
          done

      - name: Install the Snyk CLI
        if: env.HAS_SNYK == 'true'
        env:
          VERSION: 1.1309.0
          SHA256: 4802579c2818938a2f4849d270df1139f310104286a8a5c6305328a3c2eb9e1c
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/snyk" \
            "https://github.com/snyk/cli/releases/download/v$VERSION/snyk-linux"
          echo "$SHA256  $RUNNER_TEMP/bin/snyk" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/snyk"

      # One `snyk test` per manifest; exit 0 (clean) and 1 (vulnerabilities)
      # are fine, anything else fails the run so a broken Snyk run never
      # drops findings. `snyk test` only: nothing is stored in Snyk.
      - name: Snyk test
        if: env.HAS_SNYK == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_DISABLE_ANALYTICS: "1"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/snyk"
          out="$RUNNER_TEMP/snyk-results"
          mkdir -p "$out"
          python3 scripts/snyk_manifests.py --out "$dir"
          while IFS=$'\t' read -r name file _ extra; do
            [[ -n "$name" ]] || continue
            read -r -a extra_args <<< "${extra:-}"
            code=0
            "$RUNNER_TEMP/bin/snyk" test --file="$dir/$file" "${extra_args[@]}" \
              --json-file-output="$out/$name.json" > /dev/null 2>&1 || code=$?
            if (( code > 1 )); then
              echo "::error::snyk test failed for $name (exit $code)"
              exit 1
            fi
            if [[ ! -s "$out/$name.json" ]]; then
              echo "::error::snyk test wrote no result for $name"
              exit 1
            fi
          done < "$dir/manifests.txt"

      - name: Scan
        run: |
          args=()
          if [[ -f prev/report.json ]]; then
            args+=(--previous prev/report.json)
          fi
          if compgen -G "$RUNNER_TEMP/snyk-results/*.json" > /dev/null; then
            args+=(--snyk "$RUNNER_TEMP/snyk-results")
          fi
          python3 scripts/scan.py --out reports "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: reports/
          retention-days: 90

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # List open issues directly so a new issue is visible without waiting
          # for GitHub to index it in search.
          export TITLE="Package update request"
          number=$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
            | jq -sr '[.[][] | select(.pull_request == null and .title == env.TITLE)] | .[0].number // empty')

          findings=$(jq '.counts.findings' reports/report.json)
          new=$(jq '.counts.new' reports/report.json)

          # Advisories with no fix yet cannot be requested: they are listed in
          # the issue while it is open, but do not keep it open on their own.
          if [[ "$findings" == 0 ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "Nothing left to request: $run_url"
            fi
            exit 0
          fi

          { cat reports/report.md; printf '\n---\n%s\n' "$run_url"; } > body.md

          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body-file body.md
            if [[ "$new" != 0 ]]; then
              jq -r '.findings[] | select(.status == "new") | "- `\(.package)` \(.in_use | join(", ")) -> \(.request)"' \
                reports/report.json > new.txt
              { printf 'New since the last run:\n\n'; cat new.txt; printf '\n%s\n' "$run_url"; } > comment.md
              gh issue comment "$number" --body-file comment.md
            fi
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      # Last, so the report and the issue are always up to date: the run fails
      # while any library in use has a known vulnerability, fixable or not.
      - name: Fail on vulnerabilities
        run: |
          set -euo pipefail
          findings=$(jq '.counts.findings' reports/report.json)
          no_fix=$(jq '.counts.no_fix' reports/report.json)
          if (( findings + no_fix > 0 )); then
            echo "::error::$findings package(s) to request, $no_fix with no fix yet; see the report artifact and the issue"
            exit 1
          fi
